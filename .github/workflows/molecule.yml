---
name: molecule
on:
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  molecule:
    name: molecule
    runs-on: libvirt
    strategy:
      matrix:
        scenario:
          - install
          - k8s
          - update
          - registry
        image:
          - https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
        include:
          - scenario: install
            image: https://cloud-images.ubuntu.com/focal/current/focal-server-cloudimg-amd64.img
          - scenario: install
            image: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
    env:
      MOLECULE_OUTPUT_DIR: /tmp/logs
    steps:
      - name: Run devbox tests
        uses: pokerops/ansible-utils@master
        with:
          run: |
            make requirements test \
              MOLECULE_SCENARIO=${{ matrix.scenario }} \
              MOLECULE_KVM_IMAGE=${{ matrix.image.url }}
              GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload install logs
        uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.scenario }}-${{ matrix.image.distro }}.log
          path: |
            ${MOLECULE_OUTPUT_DIR}/*
          if-no-files-found: ignore
        if: always()
